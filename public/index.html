<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheus Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --term-bg: #161b22;
            --text: #c9d1d9;
            --green: #2ea043;
            --blue: #58a6ff;
            --red: #f85149;
            --yellow: #e3b341;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #header {
            padding: 10px 20px;
            background: var(--term-bg);
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #status {
            font-weight: bold;
            color: var(--green);
        }

        #main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #30363d;
        }

        #log-panel {
            width: 40%;
            background: #000;
            color: var(--green);
            overflow-y: auto;
            padding: 10px;
            font-size: 0.8rem;
            border-left: 1px solid #30363d;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 10px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .user {
            align-self: flex-end;
            background: var(--blue);
            color: #fff;
        }

        .assistant {
            align-self: flex-start;
            background: var(--term-bg);
            border: 1px solid #30363d;
        }

        #input-area {
            padding: 20px;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: var(--term-bg);
            border: 1px solid #30363d;
            color: var(--text);
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
        }

        button {
            background: var(--green);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px solid #333;
            padding-bottom: 2px;
        }
    </style>
</head>

<body>
    <div id="header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div>🔥 PROMETHeUS v2.0</div>
            <div id="status">Idle</div>
        </div>
        <div id="quota-monitor" style="display: flex; align-items: center; gap: 15px; font-size: 0.75rem;">
            <div id="active-model"
                style="color: var(--blue); font-weight: bold; background: rgba(56, 139, 253, 0.1); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--blue);">
                --</div>
            <div id="refresh-timer" title="Time until quota reset">--:--:--</div>
            <div
                style="width: 150px; height: 10px; background: #30363d; border-radius: 5px; overflow: hidden; border: 1px solid #444;">
                <div id="fuel-gauge"
                    style="width: 100%; height: 100%; background: var(--green); transition: width 0.5s ease, background 0.5s;">
                </div>
            </div>
            <div id="quota-percent">100% Remaining</div>
        </div>
    </div>
    <div id="main">
        <div id="chat-panel">
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="msgInput" placeholder="Type a command..." autocomplete="off">
                <button onclick="send()">Send</button>
            </div>
        </div>
        <div id="log-panel">
            <div class="log-entry">System initialized.</div>
        </div>
    </div>

    <script>
        const socket = io();
        const messagesDiv = document.getElementById('messages');
        const logDiv = document.getElementById('log-panel');
        const statusDiv = document.getElementById('status');
        const input = document.getElementById('msgInput');

        socket.on('connect', () => {
            log('Connected to Prometheus Core.');
        });

        socket.on('status', (msg) => {
            statusDiv.textContent = msg;
            if (msg === 'Thinking...') statusDiv.style.color = 'var(--yellow)';
            else if (msg === 'Idle') statusDiv.style.color = 'var(--green)';
            else statusDiv.style.color = 'var(--blue)';
        });

        socket.on('log', (msg) => {
            log(msg);
        });

        socket.on('usage', (stats) => {
            updateQuota(stats);
        });

        socket.on('message', (data) => {
            addMessage(data.role, data.content);
            if (data.model) {
                document.getElementById('active-model').textContent = data.model;
            }
        });

        socket.on('history', (history) => {
            messagesDiv.innerHTML = '';
            history.forEach(h => addMessage(h.role, h.content));
        });

        function send() {
            const text = input.value.trim();
            if (!text) return;
            // Optimistic update handled by server echo for now to keep sync simple
            socket.emit('message', text);
            input.value = '';
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') send();
        });

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;

            // Allow basic markdown-like checks (very simple)
            if (text.includes('```')) {
                const parts = text.split('```');
                let html = '';
                parts.forEach((part, i) => {
                    if (i % 2 === 1) html += `<pre><code>${part}</code></pre>`;
                    else html += part.replace(/\n/g, '<br>');
                });
                div.innerHTML = html;
            } else {
                div.textContent = text;
            }

            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function log(text) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateQuota(stats) {
            const gauge = document.getElementById('fuel-gauge');
            const percentText = document.getElementById('quota-percent');
            const timer = document.getElementById('refresh-timer');

            gauge.style.width = `${stats.percent}%`;
            percentText.textContent = `${stats.percent}% Remaining`;

            // Alert colors
            if (stats.percent < 20) gauge.style.background = 'var(--red)';
            else if (stats.percent < 50) gauge.style.background = 'var(--yellow)';
            else gauge.style.background = 'var(--green)';

            // Countdown
            clearInterval(window.quotaInterval);
            let timeRemaining = Math.floor(stats.msUntilReset / 1000);

            const tick = () => {
                if (timeRemaining <= 0) return;
                const h = Math.floor(timeRemaining / 3600);
                const m = Math.floor((timeRemaining % 3600) / 60);
                const s = timeRemaining % 60;
                timer.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                timeRemaining--;
            };
            tick();
            window.quotaInterval = setInterval(tick, 1000);
        }
    </script>
</body>

</html>
